<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Record Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Student Record Management System</h1>

    <form id="studentForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="text" id="id" placeholder="Student ID" required>
      <input type="text" id="course" placeholder="Course" required>
      <input type="text" id="year" placeholder="Year Level" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <button type="submit" id="saveBtn">Save Record</button>
      <button type="button" id="cancelBtn" style="display:none;">Cancel Edit</button>
    </form>

    <input type="text" id="search" placeholder="Search by ID, Course, or Year Level...">

    <h3>Students Record</h3>
    <table>
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Student ID</th>
          <th>Course</th>
          <th>Year Level</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
